version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: file:./prisma/dev.db
      JWT_SECRET: supersecret
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    environment:
      VITE_API_URL: http://backend:3333/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
